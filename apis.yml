aid: sara-health
name: SaRA Health
description: >-
  SaRA Health is a healthcare technology company that helps physical therapy,
  occupational therapy, orthopedic, and pain management practices engage patients
  between appointments through personalized SMS check-ins. The platform automates
  Remote Therapeutic Monitoring (RTM) by identifying eligible patients inside
  browser-based Electronic Medical Record (EMR) systems, sending injury- and
  care-plan-specific text-message check-ins, and handling the associated billing
  and denial management for RTM CPT codes such as 98975, 98977, and 98980-98981.
  SaRA Health reports a 65% average patient engagement rate and operates on an
  "Effector Model" in which its revenue is tied to client success. It was surfaced
  as a Techstars portfolio company and profiled in the API Evangelist network.
